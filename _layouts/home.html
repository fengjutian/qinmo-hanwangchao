---
layout: default
---
<section class="hero"><span class="hero-kicker">在线阅读</span><h1>{{ site.title }}</h1><p>{{ content | strip_html }}</p><a class="start-reading" href="{{ site.pages | where: 'chapter', true | sort: 'order' | map: 'url' | first | relative_url }}">开始阅读 →</a></section><section class="chapter-section"><div class="section-heading"><span>CONTENTS</span><h2>章节目录</h2></div><div class="chapter-grid">{% assign chapters = site.pages | where: 'chapter', true | sort: 'order' %}{% for chapter in chapters %}<a class="chapter-card" href="{{ chapter.url | relative_url }}"><span>{{ chapter.order | prepend: '0' | slice: -2, 2 }}</span><h3>{{ chapter.title }}</h3><em>阅读本章 →</em></a>{% endfor %}</div></section>
